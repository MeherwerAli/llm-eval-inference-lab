name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run eval-lab --output reports/current
      - run: docker compose -f vllm/compose.yaml config --quiet
      - uses: actions/upload-artifact@v7
        with:
          name: deterministic-evaluation-report
          path: reports/current/
